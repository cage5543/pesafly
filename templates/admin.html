<!DOCTYPE html>
<html>
<head>
<title>PesaFly Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px}
input{padding:12px;width:250px;margin:10px;border-radius:8px;border:none}
button{padding:12px 20px;background:#00ff88;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.card{background:#222;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<div id="loginBox">
<h2>🔒 PesaFly Admin</h2>
<input id="pwd" type="password" placeholder="Admin Password">
<button onclick="login()">LOGIN</button>
<p id="msg"></p>
</div>

<div id="adminBox" style="display:none">
<h2>✅ PesaFly Dashboard - LIVE</h2>
<button onclick="load()">Refresh Data</button>
<div id="data"></div>
<h3>Withdraw Requests</h3>
<div id="withdraws"></div>
</div>

<script>
async function login(){
 let p=document.getElementById('pwd').value;
 let r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
 let j=await r.json();
 if(j.success){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';load();}
 else{ document.getElementById('msg').innerText=j.error; }
}
async function load(){
 let r=await fetch('/api/admin-data'); let j=await r.json();
 if(j.error){ document.getElementById('msg').innerText='Login first'; return; }
 document.getElementById('data').innerHTML=`<div class=card>Total Users: ${j.total_users}</div>`+j.users.map(u=>`<div class=card>${u.phone} - Real:${u.real} Bonus:${u.bonus} Ref:${u.ref_bonus} Deposited:${u.deposited} Referrals:${u.referrals}</div>`).join('');
 document.getElementById('withdraws').innerHTML=j.withdraws.map(w=>`<div class=card>${w.phone} - KES ${w.amount} - ${w.status} <button onclick="approve(${w.id})">APPROVE</button></div>`).join('');
}
async function approve(id){
 await fetch('/api/admin-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); load();
}
</script>
</body>
</html>
