<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PesaFly V21</title><style>*{box-sizing:border-box}body{margin:0;background:#060a12;color:#fff;font-family:sans-serif}.menu{width:340px;background:#111827;position:fixed;left:0;top:0;bottom:0;padding:15px;overflow:auto;border-right:2px solid #f59e0b;z-index:10}.main{margin-left:340px;padding:10px}.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin:6px 0}.blue{background:#3b82f6;color:#fff}.orange{background:#f59e0b;color:#000}.red{background:#ef4444;color:#fff}.green{background:#22c55e}.dark{background:#1f2937;color:#fff;border:1px solid #334155}input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:6px 0}.tab{display:flex;gap:6px}.tab button{flex:1;padding:10px;border-radius:10px;border:1px solid #f59e0b;background:#000;color:#fff;cursor:pointer;font-weight:700}.tab button.active{background:#f59e0b;color:#000}.box{background:#1f2937;padding:10px;border-radius:10px;margin:8px 0;border:1px dashed #f59e0b;font-size:13px}.small{font-size:12px;opacity:.85;word-break:break-all}.bal{color:#22c55e;font-size:20px;font-weight:900}canvas{width:100%;background:#0b1220;border-radius:14px;border:1px solid #1e293b}.history{display:flex;gap:6px;overflow:auto}.hchip{padding:6px 10px;border-radius:20px;background:#1f2937;font-size:12px;font-weight:700;min-width:50px;text-align:center}@media(max-width:800px){.menu{position:relative;width:100%}.main{margin-left:0}}</style></head><body>
<div class="menu" id="menu">
<h2 style="color:#f59e0b">≡ MENU</h2>
<div id="authBox"><h3>Login / Register</h3><input id="authPhone" placeholder="Phone 07xxxxxxxx"><input id="authPass" type="password" placeholder="Password min 4"><input id="refInput" placeholder="Referral optional"><div style="display:flex;gap:6px"><button class="btn blue" onclick="doAuth('login')">LOGIN</button><button class="btn orange" onclick="doAuth('register')">REGISTER</button></div><div id="authMsg" class="small"></div></div>
<div id="userBox" style="display:none"><div class="bal">BAL: KES <span id="bal">0</span></div><div class="small">Real:<span id="real">0</span> Bonus:<span id="bonus">0</span> Dep:<span id="dep">0</span></div><div class="box" id="bonusBox" style="background:#f59e0b;color:#000;text-align:center;font-weight:900">Deposit 350 to unlock 1000 BONUS</div><button class="btn green" id="claimBtn" style="display:none" onclick="claimBonus()">CLAIM 1000 BONUS</button>
<div class="tab"><button id="tabSTK" class="active" onclick="switchTab('stk')">STK PUSH</button><button id="tabMAN" onclick="switchTab('manual')">MANUAL</button></div>
<div id="stkBox"><input id="depAmt" value="350" type="number"><input id="depPhone" placeholder="07xxxxxxxx"><button class="btn blue" onclick="doSTK()">DEPOSIT - STK PUSH</button><div id="stkMsg" class="small"></div></div>
<div id="manBox" style="display:none"><div class="box">Lipa Buy Goods Till: <b style="font-size:22px;color:#f59e0b">1242837</b><br>Then enter CODE below</div><input id="manAmt" value="350" type="number"><input id="manCode" placeholder="M-Pesa Code e.g QGH7ABC123" style="text-transform:uppercase"><button class="btn orange" onclick="doManual()">VERIFY & CREDIT INSTANT</button><div id="manMsg" class="small"></div></div>
<div class="box small">Ref: <b id="refLink"></b><br><button class="btn dark" onclick="copyRef()">COPY LINK</button> Refs:<span id="refCount">0</span> Earn:<span id="refEarn">0</span></div>
<input id="betAmt" value="50" type="number"><div style="display:flex;gap:6px"><button class="btn blue" id="betBtn" onclick="placeBet()">PLACE BET - KES 50</button><button class="btn green" id="cashBtn" style="display:none" onclick="doCashout()">CASHOUT</button></div><input id="withAmt" value="500" type="number"><button class="btn dark" onclick="doWithdraw()">WITHDRAW</button><div id="msg" class="small"></div><button class="btn red" onclick="doLogout()">LOGOUT</button></div></div>
<div class="main"><div class="history" id="hist"></div><canvas id="game" height="380"></canvas><div style="display:flex;justify-content:space-between"><div>Mult: <b id="mult" style="font-size:28px;color:#f59e0b">1.00x</b></div><div id="status" class="small">Waiting...</div></div></div>
<script>
let bal=0,isBet=false,bet=0,crashed=false,curMult=1.0,crashPoint=2.5,gameRunning=false,cashDone=false;
function switchTab(t){document.getElementById('stkBox').style.display=t=='stk'?'block':'none';document.getElementById('manBox').style.display=t=='manual'?'block':'none';document.getElementById('tabSTK').className=t=='stk'?'active':'';document.getElementById('tabMAN').className=t=='manual'?'active':''}
async function api(p,o){let r=await fetch(p,{method:o?.method||'GET',headers:{'Content-Type':'application/json'},body:o?.body?JSON.stringify(o.body):null});return r.json()}
async function loadMe(){let d=await api('/api/me');if(!d.logged){document.getElementById('authBox').style.display='block';document.getElementById('userBox').style.display='none';return}document.getElementById('authBox').style.display='none';document.getElementById('userBox').style.display='block';document.getElementById('bal').innerText=d.total.toFixed(0);document.getElementById('real').innerText=d.real.toFixed(0);document.getElementById('bonus').innerText=d.bonus.toFixed(0);document.getElementById('dep').innerText=d.deposited.toFixed(0);bal=d.total;if(d.can_claim){document.getElementById('claimBtn').style.display='block'}loadRef();loadHist()}
async function loadRef(){let d=await api('/api/my-referral');if(d.code){document.getElementById('refLink').innerText=d.link;document.getElementById('refCount').innerText=d.count;document.getElementById('refEarn').innerText=d.earned}}
async function loadHist(){let d=await api('/api/history');let h=document.getElementById('hist');h.innerHTML='';d.slice(-15).forEach(v=>{let c=document.createElement('div');c.className='hchip';c.style.color=v<2?'#ef4444':v<5?'#22c55e':'#f59e0b';c.innerText=v.toFixed(2)+'x';h.appendChild(c)})}
async function doAuth(act){let phone=document.getElementById('authPhone').value.trim(),pass=document.getElementById('authPass').value.trim(),ref=document.getElementById('refInput').value.trim().toUpperCase();if(!phone||!pass){document.getElementById('authMsg').innerText='Enter phone & password';return}let d=await api('/api/auth',{method:'POST',body:{email:phone,password:pass,action:act,referral:ref}});if(d.success){loadMe()}else{document.getElementById('authMsg').innerText=d.error}}
async function claimBonus(){let d=await api('/api/claim-bonus',{method:'POST'});document.getElementById('msg').innerText=d.msg||d.error;loadMe()}
async function doSTK(){let a=document.getElementById('depAmt').value,p=document.getElementById('depPhone').value||document.getElementById('authPhone').value;document.getElementById('stkMsg').innerText='Sending STK to '+p+'...';let d=await api('/api/deposit/stk',{method:'POST',body:{amount:parseFloat(a),phone:p}});document.getElementById('stkMsg').innerText=d.msg||d.error||JSON.stringify(d);if(d.success)setTimeout(loadMe,6000)}
async function doManual(){let a=document.getElementById('manAmt').value,c=document.getElementById('manCode').value.trim().toUpperCase();if(!c){document.getElementById('manMsg').innerText='Enter code';return}document.getElementById('manMsg').innerText='Verifying '+c+'...';let d=await api('/api/deposit/manual',{method:'POST',body:{amount:parseFloat(a),mpesa_code:c}});document.getElementById('manMsg').innerText=d.msg||d.error;if(d.success)loadMe()}
async function doWithdraw(){let a=document.getElementById('withAmt').value;document.getElementById('msg').innerText='Processing...';let d=await api('/api/withdraw',{method:'POST',body:{amount:parseFloat(a)}});document.getElementById('msg').innerText=d.msg||d.error;loadMe()}
function copyRef(){let t=document.getElementById('refLink').innerText;navigator.clipboard.writeText(t);alert('Copied')}
async function doLogout(){await api('/api/logout',{method:'POST'});location.reload()}
let canvas=document.getElementById('game'),ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=760}resize();
async function startRound(){if(gameRunning)return;gameRunning=true;crashed=false;cashDone=false;curMult=1.0;document.getElementById('status').innerText='Flying...';if(isBet)document.getElementById('cashBtn').style.display='block';let d=await api('/api/crash');crashPoint=d.crash;let start=Date.now();function loop(){let elapsed=(Date.now()-start)/1000;curMult=Math.pow(1.08,elapsed*2);if(curMult>=crashPoint){curMult=crashPoint;crashed=true;gameRunning=false;draw(true);endRound();return}document.getElementById('mult').innerText=curMult.toFixed(2)+'x';draw(false);if(gameRunning)requestAnimationFrame(loop)}loop()}
function draw(isCrash){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle=isCrash?'#ef4444':'#f59e0b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(40,canvas.height-60);let x=Math.min(curMult*60,canvas.width-80);let y=canvas.height-60-Math.log(curMult)*80;ctx.lineTo(40+x,y);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.fillText(curMult.toFixed(2)+'x',50,80);if(isCrash){ctx.fillStyle='#ef4444';ctx.fillText('CRASHED @ '+crashPoint.toFixed(2)+'x',50,130)}}
async function endRound(){document.getElementById('status').innerText='Crashed @ '+crashPoint.toFixed(2)+'x';document.getElementById('cashBtn').style.display='none';document.getElementById('betBtn').style.display='block';if(isBet&&!cashDone){isBet=false;bet=0;document.getElementById('msg').innerText='Crashed! Lost'}isBet=false;bet=0;loadHist();loadMe();setTimeout(startRound,4000)}
async function placeBet(){let amt=parseFloat(document.getElementById('betAmt').value);if(amt<=0||amt>bal){document.getElementById('msg').innerText='Low balance';return}let d=await api('/api/bet',{method:'POST',body:{amount:amt}});if(!d.success){document.getElementById('msg').innerText=d.error;return}isBet=true;bet=amt;cashDone=false;document.getElementById('betBtn').style.display='none';document.getElementById('cashBtn').style.display='block';document.getElementById('msg').innerText='Bet KES '+amt;loadMe()}
async function doCashout(){if(!isBet||cashDone)return;cashDone=true;let d=await api('/api/cashout',{method:'POST',body:{bet:bet,multiplier:curMult}});if(d.success){document.getElementById('msg').innerText='WIN KES '+d.win.toFixed(0)+' @ '+curMult.toFixed(2)+'x';isBet=false;document.getElementById('cashBtn').style.display='none';document.getElementById('betBtn').style.display='block';loadMe()}}
document.getElementById('betAmt').addEventListener('input',e=>{document.getElementById('betBtn').innerText='PLACE BET - KES '+e.target.value});
loadMe();startRound();
</script></body></html>
